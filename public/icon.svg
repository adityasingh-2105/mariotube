<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef2f2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background Container with iOS-style curvature -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner glow rim -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Mario Star / Glowing Accent -->
  <circle cx="390" cy="120" r="32" fill="#fbbf24" filter="url(#shadow)" />
  
  <!-- Sleek Modern Centered Play Triangle -->
  <path d="M200 156 C 190 150, 176 156, 176 170 L 176 342 C 176 356, 190 362, 200 356 L 350 270 C 362 262, 362 250, 350 242 Z" fill="url(#playGrad)" filter="url(#shadow)" />
</svg>
